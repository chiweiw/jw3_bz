<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>技能数据图表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>window.PAGE='charts'</script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/customParseFormat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/weekday.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/localeData.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/weekOfYear.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/advancedFormat.js"></script>
  <script>
    if(!window.dayjs_plugin_quarterOfYear) window.dayjs_plugin_quarterOfYear = function(){}
    if(!window.dayjs_plugin_weekYear) window.dayjs_plugin_weekYear = function(){}
    if(window.dayjs_plugin_customParseFormat) dayjs.extend(window.dayjs_plugin_customParseFormat);
    if(window.dayjs_plugin_weekday) dayjs.extend(window.dayjs_plugin_weekday);
    if(window.dayjs_plugin_localeData) dayjs.extend(window.dayjs_plugin_localeData);
    if(window.dayjs_plugin_weekOfYear) dayjs.extend(window.dayjs_plugin_weekOfYear);
    if(window.dayjs_plugin_advancedFormat) dayjs.extend(window.dayjs_plugin_advancedFormat);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .multi-select-dropdown { max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <div id="app" class="min-h-screen flex flex-col">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-2">
             <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-sm">S</div>
             <div class="text-xl font-bold text-gray-900 tracking-tight">技能数据报告</div>
          </div>
          <nav class="flex space-x-1">
            <a href="index.html" :class="['px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-200', selectedKeys.includes('index') ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900']">信息页</a>
            <a href="charts.html" :class="['px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-200', selectedKeys.includes('charts') ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900']">图表页</a>
          </nav>
        </div>
      </div>
    </header>
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="mb-6 space-y-4">
          <div class="flex flex-wrap gap-4 items-start">
            <div class="relative w-64">
              <button @click="showSkillDropdown = !showSkillDropdown" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-left bg-white flex items-center justify-between hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <span class="text-sm text-gray-700 truncate">
                  {{ selectedSeries.length ? `已选择 ${selectedSeries.length} 个序列` : '选择序列...' }}
                </span>
                <svg class="w-4 h-4 text-gray-400" :class="{'rotate-180': showSkillDropdown}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
              <div v-if="showSkillDropdown" class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-20 multi-select-dropdown">
                <div class="p-2 border-b border-gray-100 sticky top-0 bg-white">
                  <input v-model="skillSearch" type="text" placeholder="搜索..." class="w-full px-3 py-1.5 text-sm border border-gray-200 rounded focus:outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div class="p-2 border-b border-gray-100 flex gap-2">
                  <button @click="selectAllFiltered" class="text-xs px-2 py-1 bg-blue-50 text-blue-600 rounded hover:bg-blue-100">全选</button>
                  <button @click="clearSelection" class="text-xs px-2 py-1 bg-gray-50 text-gray-600 rounded hover:bg-gray-100">清空</button>
                </div>
                <div class="divide-y divide-gray-50">
                  <label v-for="s in filteredSeriesList" :key="s.series_id" class="flex items-center px-3 py-2 hover:bg-gray-50 cursor-pointer">
                    <input type="checkbox" :value="s.series_id" v-model="selectedSeries" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                    <span class="ml-2 text-sm text-gray-700 truncate">{{ s.displayName }}</span>
                  </label>
                  <div v-if="!filteredSeriesList.length" class="px-3 py-4 text-sm text-gray-400 text-center">无匹配结果</div>
                </div>
              </div>
            </div>
            
            <div class="relative w-40">
              <select v-model="state.category" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">全部分类</option>
                <option value="consume">消耗</option>
                <option value="deal">造成</option>
                <option value="recover">恢复</option>
              </select>
            </div>
            
            <div class="relative w-32">
              <select v-model="state.maxSeries" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option :value="0">不限数量</option>
                <option :value="5">最多 5 个</option>
                <option :value="10">最多 10 个</option>
                <option :value="20">最多 20 个</option>
              </select>
            </div>
            
            <label class="flex items-center cursor-pointer select-none px-3 py-2 rounded-lg border transition-colors" :class="state.showDiff ? 'bg-blue-50 border-blue-300' : 'bg-white border-gray-300 hover:bg-gray-50'">
              <input type="checkbox" v-model="state.showDiff" class="sr-only" />
              <span class="text-sm font-medium" :class="state.showDiff ? 'text-blue-700' : 'text-gray-600'">差值曲线</span>
            </label>
            
            <label class="flex items-center cursor-pointer select-none px-3 py-2 rounded-lg border transition-colors" :class="state.compareMode ? 'bg-purple-50 border-purple-300' : 'bg-white border-gray-300 hover:bg-gray-50'">
              <input type="checkbox" v-model="state.compareMode" class="sr-only" />
              <span class="text-sm font-medium" :class="state.compareMode ? 'text-purple-700' : 'text-gray-600'">对比模式</span>
            </label>
            
            <button @click="apply" class="px-5 py-2.5 bg-blue-600 text-white font-medium text-sm rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
              绘制
            </button>
            
            <button @click="resetChart" class="px-4 py-2.5 bg-gray-100 text-gray-700 font-medium text-sm rounded-lg hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
              重置
            </button>
          </div>
          
          <div v-if="selectedSeries.length > 0" class="flex flex-wrap gap-2">
            <span class="text-xs text-gray-500">已选序列：</span>
            <span v-for="sid in selectedSeries.slice(0, 10)" :key="sid" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200">
              {{ getSeriesName(sid) }}
              <button @click="removeSeries(sid)" class="ml-1 text-blue-400 hover:text-blue-600">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
              </button>
            </span>
            <span v-if="selectedSeries.length > 10" class="text-xs text-gray-400">+{{ selectedSeries.length - 10 }} 更多</span>
          </div>
        </div>
        
        <div class="relative h-[600px] w-full border border-gray-100 rounded-lg bg-white">
          <div ref="chartEl" class="absolute inset-0"></div>
          <div v-if="!chartInstance && !loading" class="absolute inset-0 flex items-center justify-center text-gray-400">
            <div class="text-center">
              <svg class="w-16 h-16 mx-auto mb-4 text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
              </svg>
              <p>选择序列后点击"绘制"查看图表</p>
            </div>
          </div>
        </div>
        
        <div v-if="state.compareMode && compareData.length" class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
          <h3 class="text-sm font-semibold text-gray-700 mb-3">对比分析</h3>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead>
                <tr class="border-b border-gray-200">
                  <th class="px-4 py-2 text-left text-gray-500 font-medium">序列</th>
                  <th class="px-4 py-2 text-right text-gray-500 font-medium">最小值</th>
                  <th class="px-4 py-2 text-right text-gray-500 font-medium">最大值</th>
                  <th class="px-4 py-2 text-right text-gray-500 font-medium">平均值</th>
                  <th class="px-4 py-2 text-right text-gray-500 font-medium">增长率</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                <tr v-for="item in compareData" :key="item.name" class="hover:bg-white">
                  <td class="px-4 py-2 text-gray-900">{{ item.name }}</td>
                  <td class="px-4 py-2 text-right text-gray-600 font-mono">{{ item.min }}</td>
                  <td class="px-4 py-2 text-right text-gray-600 font-mono">{{ item.max }}</td>
                  <td class="px-4 py-2 text-right text-gray-600 font-mono">{{ item.avg }}</td>
                  <td class="px-4 py-2 text-right">
                    <span :class="item.growth > 0 ? 'text-green-600' : item.growth < 0 ? 'text-red-600' : 'text-gray-600'">{{ item.growth }}%</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <footer class="bg-white border-t border-gray-200 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center">
        <p class="text-sm text-gray-500">Skill Growth Report ©2025 Created by Trae</p>
      </div>
    </footer>
  </div>
  <script src="assets/main.js"></script>
</body>
</html>
